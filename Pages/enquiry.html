<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../Assets/style.css">
    <link rel="icon" type="image/jpeg" href="../Assets/images/logo1.jpg">
</head>
<body class="home-page">

    <header class="site-header">
        <div class="logo-container">
            <img src="../Assets/images/logo1.jpg" alt="Crumb Studio Logo">
        </div>
         <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav class="nav-menu">
            <a href="../index.html" class="nav-link">HOME PAGE</a> |
            <a href="about.html" class="nav-link">OUR STORY</a> |
            <a href="contact.html" class="nav-link">CONTACT</a> |
            <a href="enquiry.html" class="nav-link active">ENQUIRY</a> |
            <a href="Gallery.html" class="nav-link">GALLERY</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero-section">
            <h1 class="logo-text">Enquiry</h1>

            <form class="enquiry-form">
                <div class="form-group">
                    <label>Your Name:</label>
                    <input type="text" class="form-input" placeholder="Enter your name please" required>
                </div>

                <div class="form-group">
                    <label>Email Address:</label>
                    <input type="email" class="form-input" placeholder="Where we can reply to you" required>
                </div>

                <div class="form-group">
                    <label>What enquiry is about:</label>
                    <select class="form-input" required>
                        <option value="" disabled selected>--Select--</option>
                        <option value="complaint">Complaint</option>
                        <option value="fund-us">Fund Us</option>
                        <option value="special-order">Special Order</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Message / Details:</label>
                    <textarea class="form-textarea" rows="5" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="form-button">Submit Here</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-block">
                <h3>Contact Us</h3>
                <p>📞 Phone: <a href="tel:+276622346">(+27)-662-2346</a></p>

            </div>

                </ul>
            </div>
            <div class="footer-block">
                <h3>Follow Our Page</h3>
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
